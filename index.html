<!DOCTYPE html>
<html lang="zh-TW">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>近期活動 - 質感簡約風</title>
  <link rel="icon" href="photo/73e967f4-8c44-46c1-b7a2-80f47c5ccd39.png?v=2" type="image/png">
  
  <!-- Bootstrap 5 CSS -->
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
  <!-- Bootstrap Icons -->
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.1/font/bootstrap-icons.css">
  
  <style>
    body {
      background-color: #F8F9FA; 
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Noto Sans TC", sans-serif;
    }
    .transition-hover {
      transition: transform 0.3s ease, box-shadow 0.3s ease;
    }
    .transition-hover:hover {
      transform: translateY(-5px);
      box-shadow: 0 .5rem 1rem rgba(0,0,0,.12)!important;
    }
    .card-cover-img {
      height: 190px;
      object-fit: cover;
    }

    /* 頂部動態按鈕切換 */
    .btn-top-action {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      padding: 7px 18px;
      font-size: 0.88rem;
      font-weight: 500;
      color: #18181b;
      background-color: #ffffff;
      border: 1.5px solid #27272a;
      border-radius: 9999px;
      text-decoration: none;
      cursor: pointer;
      transition: all 0.2s cubic-bezier(0.16, 1, 0.3, 1);
      box-shadow: 0 1px 2px rgba(0, 0, 0, 0.04);
      white-space: nowrap;
    }
    .btn-top-action:hover {
      background-color: #18181b;
      color: #ffffff;
      border-color: #18181b;
      transform: translateY(-1px);
    }
    body.is-admin .btn-top-action {
      background-color: #18181b;
      color: #ffffff;
      border-color: #18181b;
      font-weight: 600;
    }
    body.is-admin .btn-top-action:hover {
      background-color: #3f3f46;
      border-color: #3f3f46;
    }

    /* 登出小按鈕 */
    .btn-logout {
      display: none;
      align-items: center;
      justify-content: center;
      width: 36px;
      height: 36px;
      border-radius: 50%;
      background: #e4e4e7;
      border: 1px solid #d4d4d8;
      color: #71717a;
      cursor: pointer;
      transition: all 0.2s ease;
    }
    .btn-logout:hover {
      background: #fee2e2;
      color: #ef4444;
      border-color: #fca5a5;
    }
    body.is-admin .btn-logout {
      display: inline-flex;
    }

    /* 卡片上的管理動作按鈕 */
    .admin-card-actions {
      position: absolute;
      top: 10px;
      right: 10px;
      display: none;
      gap: 6px;
      z-index: 20;
    }
    body.is-admin .admin-card-actions { display: flex; }
    .btn-action-pill {
      background: rgba(15, 23, 42, 0.88);
      backdrop-filter: blur(6px);
      color: #ffffff;
      border: 1px solid rgba(255, 255, 255, 0.2);
      border-radius: 6px;
      padding: 4px 8px;
      font-size: 0.72rem;
      font-weight: 600;
      cursor: pointer;
      transition: background 0.15s ease;
    }
    .btn-action-pill:hover { background: #18181b; }
    .btn-action-delete:hover { background: #ef4444; border-color: #ef4444; }

    /* Toast 自動消失微提示 */
    .toast-notification {
      position: fixed;
      top: 24px;
      left: 50%;
      transform: translateX(-50%) translateY(-20px);
      background: #18181b;
      color: #ffffff;
      padding: 10px 24px;
      border-radius: 9999px;
      font-size: 0.92rem;
      font-weight: 500;
      box-shadow: 0 10px 25px -5px rgba(0, 0, 0, 0.25);
      z-index: 2050;
      opacity: 0;
      pointer-events: none;
      transition: all 0.25s cubic-bezier(0.16, 1, 0.3, 1);
      display: flex;
      align-items: center;
      gap: 8px;
    }
    .toast-notification.show {
      opacity: 1;
      transform: translateX(-50%) translateY(0);
    }

    /* 拖曳圖片上傳卡片 */
    .drop-card {
      border: 1.5px dashed #cbd5e1;
      border-radius: 12px;
      padding: 16px;
      background: #f8fafc;
      text-align: center;
      cursor: pointer;
      transition: all 0.2s ease;
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      min-height: 100px;
    }
    .drop-card:hover, .drop-card.dragover {
      border-color: #0284c7;
      background: #f0f9ff;
    }
    .cover-preview-img {
      max-height: 140px;
      max-width: 100%;
      border-radius: 8px;
      margin-top: 10px;
      object-fit: cover;
      display: none;
      box-shadow: 0 2px 8px rgba(0, 0, 0, 0.1);
    }

    input[type="date"].form-control {
      cursor: pointer;
    }
  </style>
</head>
<body>

  <div class="container py-5">
    
    <!-- 頂部導覽列：左側標題，右側動態按鈕（回主頁 ⇄ 新增活動） -->
    <div class="d-flex align-items-center justify-content-between mb-3">
      <h2 class="fw-bold mb-0">近期活動</h2>
      
      <div class="d-flex align-items-center gap-2">
        <a id="topDynamicBtn" href="https://www.kszionch.org.tw/" class="btn-top-action" title="返回教會首頁">
          <i id="topBtnIcon" class="bi bi-house-door"></i>
          <span id="topBtnLabel">回主頁</span>
        </a>

        <button id="logoutBtn" class="btn-logout" title="登出同工後台">
          <i class="bi bi-box-arrow-right"></i>
        </button>
      </div>
    </div>

    <hr class="text-muted opacity-25 mb-4">
    
    <!-- 分類按鈕列 -->
    <div class="d-flex gap-2 mb-5 overflow-x-auto py-2 ps-2" id="category-filter">
      <button class="btn btn-dark rounded-pill px-4 py-2 fw-semibold shadow-sm active-cat" data-category="全部">全部</button>
    </div>

    <!-- 活動卡片容器 -->
    <div class="row g-4" id="event-container"></div>

  </div>

  <!-- 後台活動編輯/新增彈出視窗 (Modal) -->
  <div class="modal fade" id="eventModal" tabindex="-1" aria-hidden="true">
    <div class="modal-dialog modal-dialog-centered modal-lg">
      <div class="modal-content rounded-4 border-0 shadow">
        <div class="modal-header border-bottom-0 pb-0">
          <h5 class="modal-title fw-bold" id="modalTitle">發布新活動</h5>
          <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Close"></button>
        </div>
        <div class="modal-body p-4">
          <form id="eventForm">
            <input type="hidden" id="editRowIndex" value="">
            <input type="hidden" id="editOldTitle" value="">
            <input type="hidden" id="existingImageUrl" value="">

            <div class="mb-3">
              <label class="form-label fw-semibold small text-muted">活動名稱 *</label>
              <input type="text" id="formTitle" class="form-control rounded-3" required>
            </div>

           <!-- 日期設定區（分層清爽排版） -->
            <div class="mb-3">
              <label class="form-label fw-bold small text-danger">結束報名日期 (點小日曆) *</label>
              <input type="date" id="formDeadlineDate" class="form-control rounded-3 py-2" required>
            </div>

            <div class="p-3 bg-light rounded-3 mb-4 border">
              <div class="fw-semibold small text-secondary mb-2">活動舉辦期間</div>
              <div class="row g-3 mb-3">
                <div class="col-md-6">
                  <label class="form-label small text-muted">活動開始日 (點小日曆)</label>
                  <input type="date" id="formEventStart" class="form-control rounded-3 py-2">
                </div>
                <div class="col-md-6">
                  <label class="form-label small text-muted">活動結束日 (若單天可留空)</label>
                  <input type="date" id="formEventEnd" class="form-control rounded-3 py-2">
                </div>
              </div>

              <div>
                <label class="form-label small text-muted">前台卡片顯示日期（系統自動組裝，可手動微調） *</label>
                <input type="text" id="formDisplayDate" class="form-control rounded-3 py-2 bg-white" placeholder="08/17（一）～ 08/21（五）" required>
              </div>
            </div>

            <div class="row g-3 mb-3">
              <div class="col-md-6">
                <!-- 活動分類：已改為選填（非必填） -->
                <label class="form-label fw-semibold small text-muted">活動分類 (選填)</label>
                <input type="text" id="formCategory" class="form-control rounded-3" list="categoryOptionsList" placeholder="選擇或自行輸入分類（可留空）">
                <datalist id="categoryOptionsList">
                  <option value="門徒訓練">
                  <option value="社區活動">
                  <option value="青年聚會">
                  <option value="特別特會">
                </datalist>
              </div>
              <div class="col-md-6">
                <label class="form-label fw-semibold small text-muted">活動狀態 *</label>
                <select id="formStatus" class="form-select rounded-3">
                  <option value="報名中">報名中</option>
                  <option value="訂便當">訂便當</option>
                  <option value="已額滿">已額滿</option>
                  <option value="籌備中">籌備中</option>
                </select>
              </div>
            </div>

            <div class="mb-3">
              <label class="form-label fw-semibold small text-muted">報名連結 (Google 表單或外部網址) *</label>
              <input type="url" id="formLink" class="form-control rounded-3" required>
            </div>

            <!-- 活動海報上傳區 -->
            <div class="mb-4">
              <label class="form-label fw-semibold small text-muted">活動海報圖片（拖曳上傳或點擊選取）</label>
              <div class="drop-card" id="drop_image">
                <div class="fw-bold small text-dark mb-1">🖼️ 點擊或拖曳海報至此</div>
                <div class="text-muted" style="font-size: 0.78rem;">支援 .jpg, .png, .webp 圖片格式</div>
                <img id="imagePreview" class="cover-preview-img" alt="海報預覽">
                <div class="mt-2 small text-primary fw-bold" id="imageFileName"></div>
                <input type="file" id="file_image" accept="image/*" style="display:none">
              </div>
            </div>

            <button type="submit" class="btn btn-dark w-100 py-2 rounded-3 fw-bold" id="submitBtn">發布並同步至雲端</button>
          </form>
        </div>
      </div>
    </div>
  </div>

  <!-- Bootstrap JS -->
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
  <script src="main.js"></script>
</body>
</html>
