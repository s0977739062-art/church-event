<!DOCTYPE html>
<html lang="zh-TW">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>近期活動 - 質感簡約風</title>
  <link rel="icon" href="photo/73e967f4-8c44-46c1-b7a2-80f47c5ccd39.png" type="image/png">
  <!-- Bootstrap 5 CSS -->
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
  <!-- Bootstrap Icons (線條小圖示) -->
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.1/font/bootstrap-icons.css">
  
  <style>
    /* 網頁背景採用極淺灰，讓純白卡片帶有精緻的浮現感 */
    body {
      background-color: #F8F9FA; 
    }
    .transition-hover {
      transition: transform 0.3s ease, box-shadow 0.3s ease;
    }
    .transition-hover:hover {
      transform: translateY(-5px);
      box-shadow: 0 .5rem 1rem rgba(0,0,0,.12)!important;
    }
    /* 固定圖片高度，維持版面整齊 */
    .card-cover-img {
      height: 180px;
      object-fit: cover;
    }
  </style>
</head>
<body>

  <div class="container py-5">
    
    <!-- 1. 頂部導覽列：左側標題，右側「回主頁」按鈕 -->
    <div class="d-flex align-items-center justify-content-between mb-3">
      <h2 class="fw-bold mb-0">近期活動</h2>
      
      <!-- 右側：回主頁按鈕 (請將 href 換成你主頁的網址) -->
      <a href="https://www.kszionch.org.tw/" class="btn btn-outline-dark rounded-pill px-3 py-2 fw-semibold small transition-hover">
        <i class="bi bi-house-door me-1"></i> 回主頁
      </a>
    </div>

    <!-- 💡 標題下方的質感淡灰分隔線 -->
    <hr class="text-muted opacity-25 mb-4">
    
    <!-- 2. 分類列：保留「全部」按鈕 -->
    <div class="d-flex gap-2 mb-5 overflow-x-auto py-2 ps-2" id="category-filter">
      <button class="btn btn-dark rounded-pill px-4 py-2 fw-semibold shadow-sm active-cat" data-category="全部">全部</button>
    </div>

    <!-- 3. 活動卡片的容器，由 main.js 動態填入 -->
    <div class="row g-4" id="event-container">
    </div>

  </div>

  <!-- Bootstrap JS -->
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
  <!-- 引入你的 JavaScript 檔案 -->
  <script src="main.js"></script>
</body>
</html>
